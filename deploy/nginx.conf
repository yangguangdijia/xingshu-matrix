server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Security headers. NOTE: nginx drops server-level add_header in any location
  # that has its own add_header, so they are repeated in those locations below.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location ~* \.(css|js|svg|png|woff2?)$ { expires 7d; add_header Cache-Control "public"; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Frame-Options "SAMEORIGIN" always; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "strict-origin-when-cross-origin" always; add_header X-Frame-Options "SAMEORIGIN" always; }
}
