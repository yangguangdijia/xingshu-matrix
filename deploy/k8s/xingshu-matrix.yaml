apiVersion: v1
kind: Namespace
metadata:
  name: xingshu-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: xingshu-matrix
  namespace: xingshu-system
  labels: { app: xingshu-matrix }
spec:
  replicas: 2
  selector:
    matchLabels: { app: xingshu-matrix }
  template:
    metadata:
      labels: { app: xingshu-matrix }
    spec:
      containers:
        - name: web
          image: ghcr.io/yangguangdijia/xingshu-matrix:latest
          # The image (root Dockerfile) runs matrix-server on :8080; /metrics on :9090.
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          env:
            - name: MATRIX_LISTEN
              value: ":8080"
            - name: MATRIX_METRICS_ADDR
              value: ":9090"
            # Lets replicas relay requests to the replica holding a cluster agent tunnel.
            - name: MATRIX_POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 768Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: xingshu-matrix
  namespace: xingshu-system
spec:
  selector: { app: xingshu-matrix }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xingshu-matrix
  namespace: xingshu-system
spec:
  ingressClassName: nginx
  rules:
    - host: matrix.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: xingshu-matrix, port: { number: 80 } } }
