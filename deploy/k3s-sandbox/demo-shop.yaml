# 生产模拟负载：一套多服务电商应用，用于整体联调和验收测试。
# 组成：web(nginx) → api(python) → redis / postgres(StatefulSet+PVC)，worker 消费队列，
# loadgen 持续造流量，CronJob 定时备份，HPA/PDB/探针/资源限制按生产规范配置。
# 组件依赖用注解 xingshu.io/depends-on 声明（应用拓扑据此连线；接入链路追踪后以实际调用为准）。
# api 会按比例返回 5xx、慢请求，并输出 JSON 结构化日志（含 ERROR/WARN），用于验证监控、日志、告警链路。
apiVersion: v1
kind: Namespace
metadata:
  name: shop-prod
  labels: { xingshu.io/env: prod, app.kubernetes.io/part-of: shop }
---
apiVersion: v1
kind: Secret
metadata: { name: shop-db, namespace: shop-prod }
type: Opaque
stringData:
  POSTGRES_USER: shop
  POSTGRES_DB: shop
  POSTGRES_PASSWORD: change-me-in-real-env
---
apiVersion: v1
kind: ConfigMap
metadata: { name: shop-app, namespace: shop-prod }
data:
  api.py: |
    import json, os, random, socket, time, threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    ERR = float(os.environ.get("ERROR_RATE", "0.03")); SLOW = float(os.environ.get("SLOW_RATE", "0.05"))
    STATS = {"requests": 0, "errors": 0}; LOCK = threading.Lock()
    def redis_ping():
        try:
            s = socket.create_connection((os.environ.get("REDIS_HOST", "redis"), 6379), timeout=0.5)
            s.sendall(b"INCR shop:orders\r\n"); s.recv(64); s.close(); return True
        except OSError: return False
    def log(level, msg, **kv):
        print(json.dumps({"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "level": level, "service": "shop-api", "msg": msg, **kv}), flush=True)
    class H(BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def reply(self, code, body, ctype="application/json"):
            b = body.encode(); self.send_response(code); self.send_header("Content-Type", ctype); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            t0 = time.time()
            if self.path == "/healthz": return self.reply(200, "ok", "text/plain")
            if self.path == "/metrics":
                with LOCK: r, e = STATS["requests"], STATS["errors"]
                return self.reply(200, "# TYPE shop_api_requests_total counter\nshop_api_requests_total %d\n# TYPE shop_api_errors_total counter\nshop_api_errors_total %d\n" % (r, e), "text/plain")
            n = 0
            for _ in range(random.randint(2000, 20000)): n += 1  # 模拟计算
            if random.random() < SLOW: time.sleep(random.uniform(0.5, 2.0))
            code = 200
            if random.random() < ERR: code = random.choice([500, 502, 503])
            elif not redis_ping(): code = 503
            with LOCK:
                STATS["requests"] += 1; STATS["errors"] += code >= 500
            ms = int((time.time() - t0) * 1000)
            if code >= 500: log("ERROR", "request failed", path=self.path, status=code, latency_ms=ms, trace_id="%032x" % random.getrandbits(128))
            elif ms > 500: log("WARN", "slow request", path=self.path, status=code, latency_ms=ms)
            elif random.random() < 0.1: log("INFO", "request ok", path=self.path, status=code, latency_ms=ms)
            self.reply(code, json.dumps({"path": self.path, "status": code, "host": socket.gethostname()}))
    log("INFO", "shop-api started", port=8080)
    ThreadingHTTPServer(("", 8080), H).serve_forever()
  worker.py: |
    import json, random, time
    while True:
        time.sleep(random.uniform(2, 6))
        lvl = "ERROR" if random.random() < 0.04 else ("WARN" if random.random() < 0.08 else "INFO")
        msg = {"ERROR": "payment gateway timeout", "WARN": "retrying order sync", "INFO": "order processed"}[lvl]
        print(json.dumps({"ts": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "level": lvl, "service": "shop-worker", "msg": msg, "order_id": random.randint(100000, 999999)}), flush=True)
  loadgen.py: |
    import random, time, urllib.request
    paths = ["/", "/api/products", "/api/cart", "/api/orders", "/api/search?q=phone"]
    while True:
        try: urllib.request.urlopen("http://web" + random.choice(paths), timeout=5).read()
        except Exception: pass
        time.sleep(random.uniform(0.05, 0.3))
  nginx.conf: |
    server {
      listen 80;
      location = /healthz { return 200 'ok'; }
      location / { proxy_pass http://api:8080; proxy_set_header X-Request-Id $request_id; }
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: shop-prod, labels: { app: postgres, app.kubernetes.io/part-of: shop } }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16-alpine
          envFrom: [{ secretRef: { name: shop-db } }]
          env: [{ name: PGDATA, value: /var/lib/postgresql/data/pgdata }]
          ports: [{ containerPort: 5432, name: pg }]
          readinessProbe: { exec: { command: [pg_isready, -U, shop] }, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 256Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 1Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: shop-prod, labels: { app: postgres } }
spec: { selector: { app: postgres }, ports: [{ name: pg, port: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: shop-prod, labels: { app: redis, app.kubernetes.io/part-of: shop } }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          args: [--maxmemory, 64mb, --maxmemory-policy, allkeys-lru]
          ports: [{ containerPort: 6379, name: redis }]
          readinessProbe: { tcpSocket: { port: 6379 }, periodSeconds: 10 }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 96Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: shop-prod, labels: { app: redis } }
spec: { selector: { app: redis }, ports: [{ name: redis, port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: shop-prod, annotations: { xingshu.io/depends-on: "redis,postgres" }, labels: { app: api, app.kubernetes.io/part-of: shop, app.kubernetes.io/version: "2.4.1" } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api, app.kubernetes.io/part-of: shop, app.kubernetes.io/version: "2.4.1" } }
    spec:
      containers:
        - name: api
          image: docker.io/library/python:3.12-slim-bookworm
          command: [python, -u, /app/api.py]
          env: [{ name: ERROR_RATE, value: "0.03" }, { name: SLOW_RATE, value: "0.05" }]
          ports: [{ containerPort: 8080, name: http }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 20, failureThreshold: 3 }
          resources: { requests: { cpu: 50m, memory: 48Mi }, limits: { cpu: 500m, memory: 128Mi } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: shop-app } }]
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: shop-prod, labels: { app: api } }
spec: { selector: { app: api }, ports: [{ name: http, port: 8080 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: shop-prod }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 5
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } } }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: shop-prod }
spec: { minAvailable: 1, selector: { matchLabels: { app: api } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: shop-prod, annotations: { xingshu.io/depends-on: "api" }, labels: { app: web, app.kubernetes.io/part-of: shop } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.27-alpine
          ports: [{ containerPort: 80, name: http }]
          readinessProbe: { httpGet: { path: /healthz, port: 80 }, periodSeconds: 10 }
          resources: { requests: { cpu: 20m, memory: 16Mi }, limits: { memory: 64Mi } }
          volumeMounts: [{ name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf }]
      volumes: [{ name: conf, configMap: { name: shop-app } }]
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: shop-prod, labels: { app: web } }
spec: { selector: { app: web }, ports: [{ name: http, port: 80 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: shop-prod, annotations: { xingshu.io/depends-on: "redis,postgres" }, labels: { app: worker, app.kubernetes.io/part-of: shop } }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker, app.kubernetes.io/part-of: shop } }
    spec:
      containers:
        - name: worker
          image: docker.io/library/python:3.12-slim-bookworm
          command: [python, -u, /app/worker.py]
          resources: { requests: { cpu: 10m, memory: 24Mi }, limits: { memory: 64Mi } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: shop-app } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loadgen, namespace: shop-prod, annotations: { xingshu.io/depends-on: "web" }, labels: { app: loadgen } }
spec:
  replicas: 1
  selector: { matchLabels: { app: loadgen } }
  template:
    metadata: { labels: { app: loadgen } }
    spec:
      containers:
        - name: loadgen
          image: docker.io/library/python:3.12-slim-bookworm
          command: [python, -u, /app/loadgen.py]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 48Mi } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: shop-app } }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: db-backup, namespace: shop-prod }
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: docker.io/library/postgres:16-alpine
              envFrom: [{ secretRef: { name: shop-db } }]
              command: [sh, -c, 'PGPASSWORD=$POSTGRES_PASSWORD pg_dump -h postgres -U $POSTGRES_USER $POSTGRES_DB | gzip > /tmp/backup.sql.gz && ls -l /tmp/backup.sql.gz']
              resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shop, namespace: shop-prod, annotations: { xingshu.io/owner: shop-team } }
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
    - host: api.shop.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: api, port: { number: 8080 } } } }
