# 沙箱 CI/CD 端到端验证环境（仅沙箱，不用于生产）
#   - git-server：git daemon 提供 git://git-server.cicd-demo.svc:9418/hello-web.git，仓库内容来自 ConfigMap
#   - registry：hostNetwork 的 registry:2，节点与 Pod 都通过 10.42.0.1:5000 访问（k3s registries.yaml 声明为 http）
#   - hello-web：被流水线部署的目标 Deployment
apiVersion: v1
kind: Namespace
metadata:
  name: cicd-demo
---
apiVersion: v1
kind: Namespace
metadata:
  name: matrix-cicd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-web-src
  namespace: cicd-demo
data:
  Dockerfile: |
    FROM busybox:1.36
    COPY index.html /www/index.html
    COPY VERSION /www/VERSION
    EXPOSE 8080
    CMD ["httpd", "-f", "-v", "-p", "8080", "-h", "/www"]
  index.html: |
    <!doctype html><title>hello-web</title><h1>hello-web</h1><p>built by 星枢 Matrix pipeline</p>
  VERSION: |
    1.0.0
  test.sh: |
    #!/bin/sh
    set -e
    echo "检查 index.html"
    grep -q "<h1>hello-web</h1>" index.html
    echo "检查 VERSION 格式"
    grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' VERSION
    echo "全部检查通过"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: cicd-demo
spec:
  replicas: 1
  selector: { matchLabels: { app: git-server } }
  template:
    metadata: { labels: { app: git-server } }
    spec:
      initContainers:
        - name: seed
          image: alpine/git:2.45.2
          command: ["sh", "-c"]
          args:
            - |
              set -e
              rm -rf /srv/hello-web.git /tmp/w
              git init -q -b main /tmp/w && cd /tmp/w
              cp /src/* . && chmod +x test.sh
              git -c user.name=demo -c user.email=demo@example.com add -A
              git -c user.name=demo -c user.email=demo@example.com commit -qm "init hello-web"
              git clone -q --bare /tmp/w /srv/hello-web.git
              touch /srv/hello-web.git/git-daemon-export-ok
              git -C /srv/hello-web.git config daemon.receivepack true
          volumeMounts:
            - { name: repo, mountPath: /srv }
            - { name: src, mountPath: /src }
      containers:
        - name: daemon
          image: alpine:3.20
          # alpine/git 不带 git-daemon，这里在启动时安装（仅沙箱）
          command: ["sh", "-c", "apk add -q --no-cache git-daemon && exec git daemon \"$@\"", "--", "--reuseaddr", "--export-all", "--enable=receive-pack", "--base-path=/srv", "--listen=0.0.0.0", "--port=9418", "/srv"]
          ports: [{ containerPort: 9418 }]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
          volumeMounts: [{ name: repo, mountPath: /srv }]
      volumes:
        - { name: repo, emptyDir: {} }
        - { name: src, configMap: { name: hello-web-src } }
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: cicd-demo
spec:
  selector: { app: git-server }
  ports: [{ name: git, port: 9418, targetPort: 9418 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: cicd-demo
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: registry } }
  template:
    metadata: { labels: { app: registry } }
    spec:
      hostNetwork: true
      containers:
        - name: registry
          image: registry:2.8.3
          env:
            - { name: REGISTRY_HTTP_ADDR, value: "0.0.0.0:5000" }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/registry }]
      volumes:
        - { name: data, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: cicd-demo
  labels: { app: hello-web }
spec:
  replicas: 1
  selector: { matchLabels: { app: hello-web } }
  template:
    metadata: { labels: { app: hello-web } }
    spec:
      containers:
        - name: web
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && [ -f /www/index.html ] || echo placeholder > /www/index.html; exec httpd -f -p 8080 -h /www"]
          ports: [{ containerPort: 8080 }]
          resources: { requests: { cpu: 10m, memory: 8Mi }, limits: { memory: 32Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: cicd-demo
spec:
  selector: { app: hello-web }
  ports: [{ port: 80, targetPort: 8080 }]
